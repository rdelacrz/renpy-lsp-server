[workspace]

[package]
name = "renpy-language-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tower-lsp = "0.20"
tower = "0.4"
tokio = { version = "1.37", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5.5"
ropey = "1.6"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
